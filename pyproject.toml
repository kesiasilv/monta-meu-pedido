[project]
name = "monta-meu-pedido"
version = "0.1.0"
description = "Assistente de IA que monta pedidos de comida com um classificador alimentar próprio e um workflow com LLM."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "iterative-stratification>=0.1.9",
]

[project.optional-dependencies]
# Pesado: só para treinar, indexar e rodar o classificador transformer.
ml = [
    "torch>=2.3",
    "transformers>=4.46",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "huggingface-hub>=0.25",
    "datasets>=3.0",
    "accelerate>=1.0",
]
claude = ["anthropic>=0.40"]
demo = ["gradio>=5.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmp"]

# No Linux (CI e Docker), usa o PyTorch só de CPU, bem menor que a versão com CUDA.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# O teste do baseline usa dados mínimos de propósito; esse aviso do sklearn é esperado.
filterwarnings = ["ignore:Label not .* is present in all training examples:UserWarning"]
